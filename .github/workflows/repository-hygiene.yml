name: Repository hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reject committed notebook outputs
        run: python3 scripts/notebook_hygiene.py --check

      - name: Reject tracked files larger than 25 MiB
        run: python3 scripts/check_tracked_file_sizes.py --max-mib 25
